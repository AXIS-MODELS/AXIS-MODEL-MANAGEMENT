<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NICOLA - AXIS MODEL MGMT</title>
    <link rel="stylesheet" href="style.css">

    <link rel="apple-touch-icon" sizes="180x180" href="IMAGES/apple-touch-icon.png">

    <link rel="icon" type="image/png" sizes="32x32" href="IMAGES/favicon-32x32.png">

    <link rel="icon" type="image/png" sizes="16x16" href="IMAGES/favicon-16x16.png">

    <link rel="manifest" href="IMAGES/site.webmanifest">
</head>
<body>

        <!--HEADER WITH HAMBURGER MENU-->
        <header>
            <div class="logo">
                <a href="index.html">
                <img src="IMAGES/AXIS MODEL MANAGEMENT LOGO.svg" alt="AXIS MODEL MANAGEMENT">
                </a>
            </div>
            <nav>
                <ul class="nav-links">
                    <button class="close-btn">&times;</button>
                    <li class="nav-item dropdown">
                        <a href="#" class="nav-item models-toggle">MODELS</a>
                    <ul class="dropdown-menu">
                        <li><a href="women.html">WOMEN</a></li>
                        <li><a href="men.html">MEN</a></li>
                    </ul></li>
                    <li><a href="contact.html" class="nav-item">CONTACT</a></li>
                </ul>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </nav>
        </header>

        <!--MODEL PERSONAL PAGE-->
        <section class="model-page">
            <h1 class="model-name">NICOLA P</h1>
            <div class="model-header">
                <img src="NICOLA/IMG_4383.jpg" alt="" class="headshot">
                <div class="divider-vertical"></div>
                <div class="model-details">
                    <p><strong>HEIGHT:</strong> 5'11"</p>
                    <p><strong>BUST:</strong> 32"</p>
                    <p><strong>WAIST:</strong> 24"</p>
                    <p><strong>HIPS:</strong> 33"</p>
                    <p><strong>SHOE:</strong> 7 UK</p>
                    <p><strong>HAIR:</strong> Brown</p>
                    <p><strong>EYES: </strong>Brown</p>
                </div>
            </div>
            <div class="divider-horizontal"></div>
            <div class="model-portfolio">
                <div class="portfolio-slider">
                    <div class="portfolio-images">
                        <img src="NICOLA/NICOLA 5.jpg" alt="" class="slide">
                        <img src="NICOLA/NICOLA 3.jpg" alt="" class="slide">
                        <img src="NICOLA/NICOLA 2.jpg" alt="" class="slide">
                        <img src="NICOLA/NICOLA 1.jpg" alt="" class="slide">
                    </div>
                    <button class="prev">&lt;</button>
                    <button class="next">&gt;</button>
                    <div class="dots-container"></div>
                </div>
            </div>

            <div class="fullscreen-model">
                <span class="close">&times;</span>
            </div>
        </section>

        <script src="script.js"></script>
</body>
